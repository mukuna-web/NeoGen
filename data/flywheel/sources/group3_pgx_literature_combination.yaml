    update_frequency: periodic
    expected_data_types: [combination_screens, synergy_scores]
    key_identifiers: [drug_pair, cell_line]
    joins_to_identity_spine: inchikey_join
    value_for_moat: combination synergy (preclinical, not clinical DDI)
    ingestion_priority: P2
    crawl_allowed: true
    requires_api_key: false
    estimated_size: "100s MB"
    notes: Preclinical synergy != clinical DDI; keep separated in schema.
    first_ingestion_status: not_started

