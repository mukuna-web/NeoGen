# Source registry group 1 — identity spine, structure/isomerism, DDI evidence
sources:
  # ── 1. DRUG IDENTITY SPINE ─────────────────────────────────────────────────
  - source_id: rxnorm
    name: RxNorm (NLM)
    category: drug_identity_spine
    source_url: https://www.nlm.nih.gov/research/umls/rxnorm/index.html
    access_method: api
    license_status: open
    robots_tos_status: open-us-gov-data; UMLS license for some content
    update_frequency: weekly+monthly
    expected_data_types:
      [rxcui, ingredient, brand, ndc_crosswalk, tty, relationships]
    key_identifiers: [rxcui, ndc, name]
    joins_to_identity_spine: primary_normalized_name_and_rxcui
    value_for_moat: canonical drug naming + crosswalk backbone
    ingestion_priority: P0
    crawl_allowed: true
    requires_api_key: false
    estimated_size: "~100s MB bulk"
    notes: Use RxNav API + RRF bulk; some UMLS-sourced fields need UMLS license.
    first_ingestion_status: not_started

  - source_id: dailymed_spl
    name: DailyMed SPL (NLM)
    category: drug_identity_spine
    source_url: https://dailymed.nlm.nih.gov/dailymed/spl-resources.cfm
    access_method: api
    license_status: open
    robots_tos_status: open-us-gov-data
    update_frequency: daily
    expected_data_types:
      [spl_xml, label_sections, ndc, set_id, interaction_sections]
    key_identifiers: [set_id, ndc, unii]
    joins_to_identity_spine: ndc_and_unii_join
    value_for_moat: authoritative label text incl. DDI + PK sections (citable)
    ingestion_priority: P0
    crawl_allowed: true
    requires_api_key: false
    estimated_size: "10s GB full SPL"
    notes: SPL XML is the citable backbone for label-derived DDI evidence.
    first_ingestion_status: not_started

  - source_id: openfda_labels
    name: openFDA Drug Labels
    category: drug_identity_spine
    source_url: https://open.fda.gov/apis/drug/label/
    access_method: api
    license_status: open
    robots_tos_status: open-us-gov-data; openFDA terms
    update_frequency: weekly
    expected_data_types:
      [label_json, drug_interactions, clinical_pharmacology, spl_id]
    key_identifiers: [spl_id, set_id, unii, ndc]
    joins_to_identity_spine: spl_set_id_join
    value_for_moat: JSON-structured label DDI + clin-pharm sections
    ingestion_priority: P0
    crawl_allowed: true
    requires_api_key: false
    estimated_size: "GBs"
    notes: API key optional (raises rate limit). Bulk download files also available.
    first_ingestion_status: not_started

  - source_id: openfda_ndc
    name: openFDA NDC Directory
    category: drug_identity_spine
    source_url: https://open.fda.gov/apis/drug/ndc/
    access_method: api
    license_status: open
    robots_tos_status: open-us-gov-data
    update_frequency: weekly
    expected_data_types:
      [ndc, product_type, dosage_form, route, marketing_status]
    key_identifiers: [ndc, product_id]
    joins_to_identity_spine: ndc_join
    value_for_moat: product-level NDC resolution
    ingestion_priority: P1
    crawl_allowed: true
    requires_api_key: false
    estimated_size: "100s MB"
    notes: Pairs with RxNorm + DailyMed for product resolution.
    first_ingestion_status: not_started

  - source_id: drugs_at_fda
    name: Drugs@FDA
    category: drug_identity_spine
    source_url: https://www.accessdata.fda.gov/scripts/cder/daf/
    access_method: bulk_download
    license_status: open
    robots_tos_status: open-us-gov-data
    update_frequency: weekly
    expected_data_types: [application_number, approval_dates, sponsor, products]
    key_identifiers: [appl_no, ndc]
    joins_to_identity_spine: appl_to_product
    value_for_moat: approval + sponsor provenance
    ingestion_priority: P2
    crawl_allowed: true
    requires_api_key: false
    estimated_size: "10s MB"
    notes: Bulk download files preferred over scraping.
    first_ingestion_status: not_started

  - source_id: drugcentral
    name: DrugCentral
    category: drug_identity_spine
    source_url: https://drugcentral.org/download
    access_method: bulk_download
    license_status: open
    robots_tos_status: CC-BY-SA for DB; verify at download
    update_frequency: periodic releases
    expected_data_types: [struct_id, identifiers, targets, atc, pharmacology]
    key_identifiers: [drugcentral_id, inchikey, cas, unii]
    joins_to_identity_spine: drugcentral_id_join
    value_for_moat: rich curated drug-target-identity crosswalk
    ingestion_priority: P0
    crawl_allowed: true
    requires_api_key: false
    estimated_size: "100s MB Postgres dump"
    notes: Postgres dump is the canonical bulk artifact.
    first_ingestion_status: not_started

  - source_id: unichem
    name: UniChem (EBI)
    category: drug_identity_spine
    source_url: https://www.ebi.ac.uk/unichem/
    access_method: api
    license_status: open
    robots_tos_status: EBI terms of use; open
    update_frequency: periodic
    expected_data_types: [src_compound_id_crosswalk, inchikey_map]
    key_identifiers: [inchikey, chembl_id, pubchem_cid, drugbank_id]
    joins_to_identity_spine: inchikey_universal_crosswalk
    value_for_moat: structure-id crosswalk hub across 40+ sources
    ingestion_priority: P0
    crawl_allowed: true
    requires_api_key: false
    estimated_size: "GBs (mapping)"
    notes: Key bridge between identity spine and structure caches.
    first_ingestion_status: not_started

  - source_id: umls
    name: UMLS Metathesaurus (NLM)
    category: drug_identity_spine
    source_url: https://www.nlm.nih.gov/research/umls/index.html
    access_method: licensed
    license_status: restricted
    robots_tos_status: requires UMLS license agreement
    update_frequency: biannual
    expected_data_types: [cui, atom, semantic_type, source_vocabs]
    key_identifiers: [cui, rxcui]
    joins_to_identity_spine: cui_concept_join
    value_for_moat: concept-level normalization across vocabularies
    ingestion_priority: P2
    crawl_allowed: false
    requires_api_key: true
    estimated_size: "10s GB"
    notes: Requires UMLS license; human review before ingestion.
    first_ingestion_status: blocked

  - source_id: who_atc
    name: WHO ATC/DDD
    category: drug_identity_spine
    source_url: https://www.whocc.no/atc_ddd_index/
    access_method: manual
    license_status: requires_review
    robots_tos_status: WHOCC reuse terms restrict redistribution
    update_frequency: annual
    expected_data_types: [atc_code, ddd, classification]
    key_identifiers: [atc_code]
    joins_to_identity_spine: atc_class_join
    value_for_moat: therapeutic classification spine
    ingestion_priority: P2
    crawl_allowed: false
    requires_api_key: false
    estimated_size: small
    notes: Redistribution restricted; use DrugCentral/RxNorm ATC mirror where licensed.
    first_ingestion_status: blocked

  # ── 2. STRUCTURE + ISOMERISM ──────────────────────────────────────────────
  - source_id: pubchem
    name: PubChem (NCBI)
    category: structure_isomerism
    source_url: https://pubchem.ncbi.nlm.nih.gov/docs/programmatic-access
    access_method: api
    license_status: open
    robots_tos_status: open; PUG-REST rate limits (~5 req/s)
    update_frequency: daily
    expected_data_types: [cid, smiles, inchi, inchikey, descriptors, synonyms]
    key_identifiers: [pubchem_cid, inchikey]
    joins_to_identity_spine: cid_inchikey_join
    value_for_moat: canonical structure + identity at scale
    ingestion_priority: P0
    crawl_allowed: true
    requires_api_key: false
    estimated_size: "100s GB full; targeted use only"
    notes: Use PUG-REST/PUG-View with rate limiting; bulk FTP for large sets.
    first_ingestion_status: not_started

  - source_id: pubchem3d
    name: PubChem3D Conformers
    category: structure_isomerism
    source_url: https://pubchem.ncbi.nlm.nih.gov/docs/3d
    access_method: bulk_download
    license_status: open
    robots_tos_status: open
    update_frequency: periodic
    expected_data_types: [conformer_sdf, 3d_coordinates]
    key_identifiers: [pubchem_cid]
    joins_to_identity_spine: cid_join
    value_for_moat: seed 3D conformers for conformer_3d_v1 tier
    ingestion_priority: P1
    crawl_allowed: true
    requires_api_key: false
    estimated_size: "100s GB; targeted subset only"
    notes: NeoGen still generates deterministic conformers; PubChem3D is a seed/check.
    first_ingestion_status: not_started

  - source_id: chembl
    name: ChEMBL (EBI)
