    license_status: open
    robots_tos_status: CC-BY-SA 3.0
    update_frequency: 2-3 releases/yr
    expected_data_types:
      [chembl_id, structures, bioactivity, targets, mechanisms]
    key_identifiers: [chembl_id, inchikey]
    joins_to_identity_spine: chembl_id_join
    value_for_moat: bioactivity + mechanism + structure in one DB
    ingestion_priority: P0
    crawl_allowed: true
    requires_api_key: false
    estimated_size: "~25 GB sqlite/postgres"
    notes: Bulk DB dump is canonical; also has REST API.
    first_ingestion_status: not_started

  - source_id: chebi
    name: ChEBI (EBI)
